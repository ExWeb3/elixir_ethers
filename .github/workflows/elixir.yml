name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test - Lint - Dialyze

    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        variation:
          - otp: "29.x"
            elixir: "1.20"
            report_coverage: true
          - otp: "28.x"
            elixir: "1.20"
            report_coverage: false
          - otp: "29.x"
            elixir: "1.19"
            report_coverage: false
          - otp: "28.x"
            elixir: "1.19"
            report_coverage: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.variation.otp}}
          elixir-version: ${{matrix.variation.elixir}}

      # Official static build from binaries.soliditylang.org, pinned and checksum verified
      # (sha256 from https://binaries.soliditylang.org/linux-amd64/list.json).
      - name: Install Solidity
        env:
          SOLC_VERSION: 0.8.30+commit.73712a01
          SOLC_SHA256: f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/solc" \
            "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v${SOLC_VERSION}"
          echo "${SOLC_SHA256}  $RUNNER_TEMP/solc" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/solc" /usr/local/bin/solc
          solc --version

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Start Anvil (Background)
        run: anvil &

      - name: Prepare for tests
        run: elixir test/test_prepare.exs

      - name: Run tests and report coverage
        if: ${{matrix.variation.report_coverage}}
        run: mix coveralls.github

      - name: Run tests
        if: ${{!matrix.variation.report_coverage}}
        run: mix coveralls

      - name: Credo
        run: mix credo --strict

      - name: Dialyzer
        run: mix dialyzer
